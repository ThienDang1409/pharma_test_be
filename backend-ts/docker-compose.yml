version: '3.8'

services:
  backend-ts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://root:example@mongo:27017/backenddb?authSource=admin
      - JWT_SECRET=this-is-a-placeholder-secret-for-jwt-do-not-use-in-prod-123!
      - JWT_REFRESH_SECRET=this-is-a-placeholder-refresh-secret-do-not-use-in-prod-123!
    depends_on:
      - mongo
    networks:
      - backend-network
    volumes:
      - ./logs:/app/logs

  mongo:
    image: mongo:6.0
    container_name: backend_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: backenddb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mongodb_data:
